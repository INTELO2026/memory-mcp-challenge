name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests benchmark demo

      - name: Ruff format check
        run: ruff format --check src tests benchmark demo

  smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Smoke tests (API + intégrité)
        run: pytest tests/test_smoke.py -v --tb=short

  regression:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Regression tests (finale — squelette insuffisant)
        env:
          PYTHONPATH: src:.
          # Embeddings Gemini (recommandé). Ajouter le secret dans
          # Settings > Secrets > Actions. Sans clé, installer le fallback local
          # avec `pip install -e ".[local]"` (tire torch + modèle e5).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pytest tests/test_regression.py tests/test_storage.py tests/test_tools.py -v --tb=short

  finale-eval:
    runs-on: ubuntu-latest
    needs: regression
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout participant repo
        uses: actions/checkout@v4

      - name: Checkout tests cachés (dépôt privé)
        uses: actions/checkout@v4
        with:
          repository: INTELO2026/memory-mcp-eval
          token: ${{ secrets.EVAL_REPO_PAT }}
          path: _eval

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests cachés finale
        env:
          FINALE_EVAL: "1"
          EVAL_SEED: ${{ secrets.EVAL_SEED }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: src:.
        run: pytest _eval/hidden_tests/ -v --tb=short
